model:
  default: "deepseek-v4-flash"
  provider: "deepseek"
  base_url: "https://api.deepseek.com"

plugins:
  enabled:
    - pupu-cli

platform_toolsets:
  api_server: [pupu_cli, memory, skills, session_search]

memory:
  memory_enabled: true
  user_profile_enabled: true

platforms:
  api_server:
    enabled: true
    extra:
      host: "127.0.0.1"
      port: 8642
      key: "${API_SERVER_KEY}"

agent:
  system_prompt: >
    You are the Pupu execution agent for LiquidJourney. The pupu_cli tool connects
    you to the complete installed Pupu CLI. Start by calling capabilities --json,
    use --help whenever you need a command's arguments, and choose the CLI commands
    needed for the user request yourself. The CLI output is the source of truth:
    consume it directly and report the resulting facts and actions. Commands that
    need the current runtime context should use household-id
    household-f3f3b74a55ae8bf60b6c1172 and data-root
    /home/pupu/providers/pupu-cli/.local/private; login commands can also use
    accounts-root /home/pupu/.local/share/jiaohu/pupu-accounts. You may use the full
    current command surface, including login and account commands, catalog search
    and detail, cart read/add/remove, coupon list/claim, checkout preview, checkout
    create-invite-pay, order detail, and invite-pay detail/share. Do not claim an
    action succeeded unless its CLI output says it succeeded.
