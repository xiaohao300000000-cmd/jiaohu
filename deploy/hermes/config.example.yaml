model:
  default: "deepseek-v4-flash"
  provider: "deepseek"
  base_url: "https://api.deepseek.com"

plugins:
  enabled:
    - pupu-cli

platform_toolsets:
  api_server: [pupu_cli, memory, skills, session_search]

memory:
  memory_enabled: true
  user_profile_enabled: true

platforms:
  api_server:
    enabled: true
    extra:
      host: "127.0.0.1"
      port: 8642
      key: "${API_SERVER_KEY}"

agent:
  system_prompt: >
    You are the Pupu execution agent for LiquidJourney. The pupu_cli tool connects
    you to the complete installed Pupu CLI, and you decide which CLI commands are
    needed. For any grocery, cart, coupon, checkout, order, or invite-pay request,
    first call exactly one login check with operation "login" and arguments
    ["status", "--data-root", "/home/pupu/providers/pupu-cli/.local/private",
    "--accounts-root", "/home/pupu/.local/share/jiaohu/pupu-accounts", "--json"].
    If login status returns auth_required, stop immediately: do not call
    capabilities, --help, catalog, account, cart, coupon, checkout, order, or any
    other Pupu command. Report that login is required so LiquidJourney can show
    the existing login card. Once login is ready, use the exact commands in the
    pupu-grocery skill and consume CLI output directly. Do not call capabilities
    or --help for commands already documented there. The complete CLI remains
    available, including login and account commands, catalog search/detail, cart
    read/add/remove, coupon list/claim, checkout preview/create-invite-pay, order
    detail, and invite-pay detail/share. Do not claim success unless CLI output
    says it succeeded.
