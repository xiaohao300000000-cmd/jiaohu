name: pupu-readonly
version: "1.0.0"
description: Restricted read-only access to the external Pupu CLI
requires_env:
  - name: PUPU_CLI_PATH
    description: Absolute path to the Pupu CLI executable
  - name: PUPU_DATA_DIR
    description: Absolute path to the private Pupu runtime data
  - name: PUPU_HOUSEHOLD_ID
    description: Scoped household identifier
